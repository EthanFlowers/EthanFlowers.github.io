---
layout: default
---
<article class="page container">
  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
    {%- if page.subtitle and page.subtitle != "" %}
    <p class="post-lede">{{ page.subtitle }}</p>
    {%- endif %}
  </header>
  <div class="page-content prose">
    {{ content }}
  </div>
</article>
